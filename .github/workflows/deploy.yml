name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write    # 必须有，OIDC 要用
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: node --check server.js   # 最简单的检查，以后换成真正的测试

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::063487531196:role/github-deploy-role
          aws-region: ap-southeast-2

      - name: Deploy via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-037a8cbc88ba114ac \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["sudo -u ec2-user bash -lc \"cd ~/app && git pull && npm ci && pm2 restart demo-api\""]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id i-你的实例ID

          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id i-037a8cbc88ba114ac --query "Status" --output text